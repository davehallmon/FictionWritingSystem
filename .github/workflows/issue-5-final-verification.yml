name: Issue 5 Final Verification

on:
  push:
    branches:
      - translation/issue-5-residual-terminology

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run terminology normalization and residual scan
        run: python tools/translation/audit_residuals_policy.py --fix-terminology --write --allow-incomplete
      - name: Ensure normalizer does not mutate restored Drama READMEs
        run: |
          git diff --exit-code -- 'drama/Chinese-to-English/README - DRAMA SKILLS' 'drama/Chinese-to-English/README - Drama Skills - English.md'
      - name: Run translation regression tests
        run: python -m unittest discover -s tools/translation/tests -v
      - name: Enforce issue 5 acceptance
        run: python tools/translation/audit_residuals_policy.py --write
