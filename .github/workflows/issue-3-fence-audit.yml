name: Issue 3 fenced-content repair

on:
  push:
    branches:
      - audit/issue-3-fenced-template-policy

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: audit/issue-3-fenced-template-policy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair the five audited files
        run: python3 -m tools.translation.issue3_repair_fences

      - name: Run translation regression tests
        run: python3 -m unittest discover -s tools/translation/tests -p 'test_*.py'

      - name: Verify repaired files with validator
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            "Ref - analysis-writing-techniques.md" \
            "Ref - anti-ai-writing.md" \
            "Ref - artifact-protocols.md" \
            "Ref - character-state-reverse.md" \
            "Ref - long-emotional-methods.md"
          do
            python3 tools/translation/validate_translation.py \
              "oh-story/$name" \
              "oh-story/Chinese-to-English/$name"
          done

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit repaired translations
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No issue #3 translation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "oh-story/Chinese-to-English/Ref - analysis-writing-techniques.md" \
            "oh-story/Chinese-to-English/Ref - anti-ai-writing.md" \
            "oh-story/Chinese-to-English/Ref - artifact-protocols.md" \
            "oh-story/Chinese-to-English/Ref - character-state-reverse.md" \
            "oh-story/Chinese-to-English/Ref - long-emotional-methods.md"
          git commit -m "Reconcile fenced translation policy in five files (#3)"
          git push origin HEAD:audit/issue-3-fenced-template-policy
