name: Issue 4 population audit

on:
  push:
    branches:
      - audit/issue-4-markdown-invariants
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run translation regression tests
        run: python -m unittest discover -s tools/translation/tests -v
      - name: Restore material-decomposition structure
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('oh-story/Chinese-to-English/Ref - material-decomposition.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '**Stacked detonations**: a surface detonation such as death or separation may erupt first, followed in its aftermath by a deeper truth or perceptual overturn. Record whether stacking exists, each detonation, and where their combination creates more than additive force.',
                  '**Stacked detonations**: a surface detonation such as death or separation may erupt first, followed in its aftermath by a deeper truth or perceptual overturn. Record:\n- Whether stacking exists.\n- What the surface and deep detonations are.\n- Where their combination creates more than additive force.'
              ),
              (
                  '**Chained detonations**: wealthy-family revenge and public-opinion reversal may contain several independent but related explosions. Record the number and nature of each, whether they escalate or satisfy in parallel dimensions, and whether spacing avoids emotional rupture or fatigue.',
                  '**Chained detonations**: wealthy-family revenge and public-opinion reversal may contain several independent but related explosions. Record:\n- The number and nature of each.\n- Whether they escalate or satisfy in parallel dimensions.\n- Whether spacing avoids emotional rupture or fatigue.'
              ),
              (
                  '**Reversal chain**: list each consecutive reversal in order with type, trigger, and changed reader perception; describe causality between reversals and the chain\'s overall escalation, stacking, or surprise.',
                  '**Reversal chain**: list each consecutive reversal in order:\n- Each reversal: type + trigger + changed reader perception.\n- Causality between reversals, including how an earlier reversal prepares a later one.\n- Overall effect of the chain: escalation, stacking, or surprise.'
              ),
              (
                  'Extract only pairs with direct interaction or explicit emotional description. Keep the final state and record history in evolution. Identify exact turn locations and causes.',
                  '- Extract only pairs with direct interaction or explicit emotional description.\n- Keep the final state and record history in evolution.\n- Identify exact turn locations and causes.'
              ),
              (
                  'Analyze benefits, costs, information control such as unreliable narration, and timing/effect of switches.\n\n**Proxy problem**: when the POV character cannot act directly, such as a watching spirit or unconscious observer, a living proxy must perform actions. The proxy\'s entrance and agency determine credibility.',
                  'Analyze:\n- Benefits and costs of the selected POV.\n- Information control within the POV, such as unreliable narration.\n- Timing and effect of POV switches, when present.\n- **Proxy problem**: when the POV character cannot act directly, such as a watching spirit or unconscious observer, a living proxy must perform actions. The proxy\'s entrance and agency determine credibility.'
              ),
              (
                  'Patterns: interrogation, suppression, information gap, and push-pull.\n\nTrack changes in forms of address, such as `阿虎` vs. `林川`, because they reveal relationship and identity changes. Record the trigger.',
                  '**Dialogue-pattern identification**:\n- Interrogation: the protagonist asks questions → the other side is forced to expose itself.\n- Suppression: short, forceful lines press relentlessly → the other side becomes hysterical.\n- Information gap: the two sides have asymmetric information, with the reader in between.\n- Push-pull: characters move closer and then pull away in a repeated cycle.\n- Track changes in forms of address, such as `阿虎` vs. `林川`, because they reveal relationship and identity changes. Record the trigger.'
              ),
              (
                  '### Explosive-Beat Potential\n\nAssess the central explosive beat, adequacy of setup and release, and shareability.\n\n### Discussion Potential\n\nAsk what readers will discuss, what is controversial, whether it prompts self-reflection, and whether it creates “What would I do?” conversation.',
                  '### Explosive-Beat Potential\n\nAssess:\n- What is the central explosive beat?\n- Is its setup sufficient?\n- Is its release fully delivered?\n- Is it shareable?\n\n### Discussion Potential\n\nAssess:\n- What will readers discuss after finishing?\n- Is there a controversial point?\n- Does it prompt self-reflection through identification?\n- Does it create room for “What would I do?” discussion?'
              ),
              (
                  '### Classification\n\nUse the two dimensions from Stage 5: narrative {protagonist/major support/function} + action {active/passive/transforming}.',
                  '### Classification\n\n> Use the two dimensions from Stage 5: narrative {protagonist/major support/function} + action {active/passive/transforming}.'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
              elif count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:100]}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit material-decomposition repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Material-decomposition repair already present."
          else
            git add "oh-story/Chinese-to-English/Ref - material-decomposition.md"
            git commit -m "Restore material-decomposition structural fidelity (#4)"
            git push
          fi
      - name: Audit all translation pairs
        run: python -m tools.translation.audit_invariants --output issue-4-audit.json
      - name: Print audit summary
        if: always()
        run: |
          if [ -f issue-4-audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          print(json.dumps(report['summary'], ensure_ascii=False, indent=2))
          for finding in report.get('findings', []):
              if finding.get('errors'):
                  print('\n###', finding['destination'])
                  print(json.dumps(finding['errors'], ensure_ascii=False))
                  print(json.dumps({k:v for k,v in finding.get('details', {}).items() if k not in {'inline_code_formatting','protected_token_formatting'}}, ensure_ascii=False, indent=2))
          PY
          fi
      - name: Enforce population gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          failures = report['summary']['validator_failing']
          if failures:
              raise SystemExit(f'{failures} translation pair(s) still fail the approved validator')
          PY
