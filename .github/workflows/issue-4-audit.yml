name: Issue 4 population audit

on:
  push:
    branches:
      - audit/issue-4-markdown-invariants
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run translation regression tests
        run: python -m unittest discover -s tools/translation/tests -v
      - name: Apply verified Oh Story repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          GUIDE_START = '<!-- translation-guide: non-executable -->'
          GUIDE_END = '<!-- /translation-guide -->'
          GUIDE_LABEL = '**English guide (non-executable):**'

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]}')

          def wrap_guides(path: Path) -> None:
              text = path.read_text(encoding='utf-8')
              if GUIDE_START in text:
                  # These files have no previously approved guide regions; reruns are idempotent.
                  return
              starts = []
              cursor = 0
              while True:
                  pos = text.find(GUIDE_LABEL, cursor)
                  if pos < 0:
                      break
                  starts.append(pos)
                  cursor = pos + len(GUIDE_LABEL)
              if not starts:
                  raise SystemExit(f'{path}: no English guide labels found')
              for pos in reversed(starts):
                  next_h3 = text.find('\n### ', pos)
                  next_h2 = text.find('\n## ', pos)
                  candidates = [value for value in (next_h3, next_h2) if value >= 0]
                  end = min(candidates) if candidates else len(text)
                  region = text[pos:end].rstrip()
                  if '```' in region:
                      raise SystemExit(f'{path}: guide region unexpectedly contains a fenced block')
                  wrapped = f'{GUIDE_START}\n{region}\n{GUIDE_END}\n'
                  text = text[:pos] + wrapped + text[end:]
              path.write_text(text, encoding='utf-8')

          readme = Path('oh-story/Chinese-to-English/README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('<!-- Last synced with README.md: 2026-08-30 -->\n\n', '', 1)
          old = ('Natural language also triggers: “帮我开书” ("help me start writing") → `story-long-write`, '
                 '“这篇太AI了” ("this is too AI-ish") → `story-deslop`, “把我的书导进来” ("import my book") → `story-import`, '
                 '“打开工作台” ("open the dashboard") → `story dashboard`, “记住我的写作习惯” ("remember my writing habits") → `story` author memory, '
                 'and “沈栀现在什么状态” ("what is Shen Zhi’s current status?") → the `story-explorer` agent.')
          new = ('Natural language also triggers:\n'
                 '- “帮我开书” ("help me start writing") → `story-long-write`\n'
                 '- “这篇太 AI 了” ("this is too AI-ish") → `story-deslop`\n'
                 '- “把我的书导进来” ("import my book") → `story-import`\n'
                 '- “打开工作台” ("open the dashboard") → `story dashboard`\n'
                 '- “记住我的写作习惯” ("remember my writing habits") → `story` author memory\n'
                 '- “沈栀现在什么状态” ("what is Shen Zhi’s current status?") → automatically spawn the `story-explorer` agent')
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('README: expected natural-language routing paragraph not found')
          readme.write_text(text, encoding='utf-8')

          replace_once(
              Path('oh-story/Chinese-to-English/Ref - anti-ai-writing.md'),
              '- “It is not difficult to see”\n- “This shows that”\n- “In fact”\n- “In conclusion”',
              '- “It is not difficult to see” / “This shows that” / “In fact” / “In conclusion”',
          )

          replace_once(
              Path('oh-story/Chinese-to-English/Ref - genre-readers.md'),
              '### Effective Ranking Scan\n\n1. Run the current scan/analyze workflow for recent target-platform samples.\n2. Exclude leaders with built-in fan bases.\n3. Analyze common opening structures in reproducible samples.\n\nEstablish the core conflict within the first 300 Chinese characters; the first 10,000 determine competitiveness.',
              '### Effective Ranking Scan\n\nRanking-scan rules: (1) run the current scan/analyze workflow for recent target-platform samples; (2) exclude leaders with built-in fan bases; and (3) analyze common opening structures in reproducible samples. Establish the core conflict within the first 300 Chinese characters; the first 10,000 determine competitiveness.',
          )

          replace_once(
              Path('oh-story/Chinese-to-English/Ref - long-genre-mechanics.md'),
              'Every chapter must contain at least one of three elements:\n\n1. An anticipation point related to the central hook.\n2. A cathartic payoff related to the central hook.\n3. Movement between an anticipation point and its payoff.',
              'Every chapter must contain at least one of three elements: (1) an anticipation point related to the central hook; (2) a cathartic payoff related to the central hook; or (3) movement between an anticipation point and its payoff.',
          )

          setup = Path('oh-story/Chinese-to-English/SKILL - story-setup.md')
          setup_text = setup.read_text(encoding='utf-8')
          old_indent = '    - Thirteen command files exist under `.opencode/commands/`'
          new_indent = '     - Thirteen command files exist under `.opencode/commands/`'
          if old_indent in setup_text:
              setup_text = setup_text.replace(old_indent, new_indent, 1)
          elif new_indent not in setup_text:
              raise SystemExit('story-setup: expected command-files list item not found')
          setup.write_text(setup_text, encoding='utf-8')

          replace_once(
              Path('oh-story/Chinese-to-English/Ref - workflow-revision.md'),
              '**English guide (non-executable):**\n\n> After revising Chapter {X}, the following chapters may require synchronized changes:  \n> Chapter {X+1}: {reason} (review recommended)  \n> Chapter {X+3}: {reason} (review recommended)\n\n8. **Manuscript metadata scan**',
              '<!-- translation-guide: non-executable -->\n**English guide (non-executable):**\n\n> After revising Chapter {X}, the following chapters may require synchronized changes:  \n> Chapter {X+1}: {reason} (review recommended)  \n> Chapter {X+3}: {reason} (review recommended)\n<!-- /translation-guide -->\n\n8. **Manuscript metadata scan**',
          )

          for filename in (
              'Template - story-consistency.md',
              'Template - story-format.md',
              'Template - story-narrative.md',
          ):
              wrap_guides(Path('oh-story/Chinese-to-English') / filename)
          PY
      - name: Commit verified Oh Story repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Verified Oh Story repairs are already present."
          else
            git add \
              "oh-story/Chinese-to-English/README.md" \
              "oh-story/Chinese-to-English/Ref - anti-ai-writing.md" \
              "oh-story/Chinese-to-English/Ref - genre-readers.md" \
              "oh-story/Chinese-to-English/Ref - long-genre-mechanics.md" \
              "oh-story/Chinese-to-English/Ref - workflow-revision.md" \
              "oh-story/Chinese-to-English/SKILL - story-setup.md" \
              "oh-story/Chinese-to-English/Template - story-consistency.md" \
              "oh-story/Chinese-to-English/Template - story-format.md" \
              "oh-story/Chinese-to-English/Template - story-narrative.md"
            git commit -m "Repair verified Oh Story structural invariants (#4)"
            git push
          fi
      - name: Audit all translation pairs
        run: python -m tools.translation.audit_invariants --output issue-4-audit.json
      - name: Print audit summary and remaining failures
        if: always()
        run: |
          if [ -f issue-4-audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          print(json.dumps(report['summary'], ensure_ascii=False, indent=2))
          for finding in report.get('findings', []):
              if finding.get('errors'):
                  print('\n###', finding['destination'])
                  print(json.dumps(finding['errors'], ensure_ascii=False))
                  print(json.dumps({k:v for k,v in finding.get('details', {}).items() if k not in {'inline_code_formatting','protected_token_formatting'}}, ensure_ascii=False, indent=2))
          PY
          fi
      - name: Enforce population gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          failures = report['summary']['validator_failing']
          if failures:
              raise SystemExit(f'{failures} translation pair(s) still fail the approved validator')
          PY
