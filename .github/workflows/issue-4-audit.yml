name: Issue 4 population audit

on:
  push:
    branches:
      - audit/issue-4-markdown-invariants
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run translation regression tests
        run: python -m unittest discover -s tools/translation/tests -v
      - name: Apply final simple structural repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]}')

          replace_once(
              Path('oh-story/Chinese-to-English/Ref - long-genre-mechanics.md'),
              '### Awareness of Information Control\n\nContinually ask:\n\n1. What do readers know before opening the book?\n2. What do they know after reading the premise?\n3. What do they know after reading the plot?\n\nControlling what readers know is the primary method for solving plot-design problems.',
              '### Awareness of Information Control\n\nContinually ask: (1) What do readers know before opening the book? (2) What do they know after reading the premise? (3) What do they know after reading the plot? Controlling what readers know is the primary method for solving plot-design problems.',
          )

          replace_once(
              Path('oh-story/Chinese-to-English/SKILL - story-setup.md'),
              '    - `.codex/hooks/story_codex_hook.py`, `run-story-hook.sh`, `run-story-hook.cmd` exist; Python syntax is valid and POSIX/Windows launchers locate project root from nested cwd',
              '   - `.codex/hooks/story_codex_hook.py`, `run-story-hook.sh`, `run-story-hook.cmd` exist; Python syntax is valid and POSIX/Windows launchers locate project root from nested cwd',
          )
          PY
      - name: Commit final simple repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Simple repairs already present."
          else
            git add \
              "oh-story/Chinese-to-English/Ref - long-genre-mechanics.md" \
              "oh-story/Chinese-to-English/SKILL - story-setup.md"
            git commit -m "Repair final simple translation list invariants (#4)"
            git push
          fi
      - name: Audit all translation pairs
        run: python -m tools.translation.audit_invariants --output issue-4-audit.json
      - name: Print material-decomposition diagnostics
        if: always()
        run: |
          if [ -f issue-4-audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          from tools.translation.validate_translation import LIST_ITEM_RE, BLOCKQUOTE_RE, comparison_text, without_fences

          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          print(json.dumps(report['summary'], ensure_ascii=False, indent=2))

          def comparable_lines(path):
              raw = Path(path).read_text(encoding='utf-8')
              compared, _ = comparison_text(raw)
              return without_fences(compared).splitlines()

          def list_entries(path):
              out = []
              for n, line in enumerate(comparable_lines(path), 1):
                  m = LIST_ITEM_RE.match(line)
                  if m:
                      marker = m.group('marker')
                      kind = 'ordered' if marker[0].isdigit() else 'unordered'
                      out.append((n, len(m.group('indent').expandtabs(4)), kind, bool(m.group('checkbox')), line.strip()))
              return out

          def quotes(path):
              out = []
              for n, line in enumerate(comparable_lines(path), 1):
                  m = BLOCKQUOTE_RE.match(line)
                  if m:
                      out.append((n, len(m.group('marks')), line.strip()))
              return out

          for finding in report.get('findings', []):
              if not finding.get('errors'):
                  continue
              print('\n###', finding['destination'])
              print('errors:', finding['errors'])
              if finding['destination'].endswith('Ref - material-decomposition.md'):
                  print('\nSOURCE LIST ENTRIES')
                  for i, item in enumerate(list_entries(finding['source'])):
                      print(i, item)
                  print('\nOUTPUT LIST ENTRIES')
                  for i, item in enumerate(list_entries(finding['destination'])):
                      print(i, item)
                  print('\nSOURCE BLOCKQUOTES', quotes(finding['source']))
                  print('\nOUTPUT BLOCKQUOTES', quotes(finding['destination']))
          PY
          fi
      - name: Enforce population gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          failures = report['summary']['validator_failing']
          if failures:
              raise SystemExit(f'{failures} translation pair(s) still fail the approved validator')
          PY
