name: Issue 4 population audit

on:
  push:
    branches:
      - audit/issue-4-markdown-invariants
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow parser repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/translation/validate_translation.py')
          text = path.read_text(encoding='utf-8')

          text, url_count = re.subn(
              r'^TRAILING_URL_PUNCTUATION = .*$',
              lambda _: 'TRAILING_URL_PUNCTUATION = ".,;:!?\\\"\'。，、；：！？"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if url_count != 1:
              raise SystemExit(f'Expected one URL punctuation constant; found {url_count}')

          token_line = 'TOKEN_RE = re.compile(r"\\$\\{[^}]+\\}|\\{\\{[^}]+\\}\\}|(?<!\\w)--[A-Za-z0-9_][A-Za-z0-9_-]*|(?<!\\w)\\$[A-Za-z0-9_][A-Za-z0-9_-]*")'
          text, token_count = re.subn(
              r'^TOKEN_RE = re\.compile\(.*\)$',
              lambda _: token_line,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if token_count != 1:
              raise SystemExit(f'Expected one TOKEN_RE definition; found {token_count}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Run translation regression tests
        run: python -m unittest discover -s tools/translation/tests -v
      - name: Commit tested validator repair
        run: |
          if git diff --quiet -- tools/translation/validate_translation.py; then
            echo "Validator already contains the tested parser repairs."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/translation/validate_translation.py
            git commit -m "Tighten CLI token parsing in validator (#4)"
            git push
          fi
      - name: Apply verified drama content repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('drama/Chinese-to-English/Docs - comic-drama-workflow.md'): [
                  ('**English guide (non-executable):** Use $short-drama to initialize a 9:16 vertical motion-comic project about an urban underdog\'s rise.',
                   '**English guide (non-executable):** Initialize a 9:16 vertical motion-comic project about an urban underdog\'s rise.'),
                  ('**English guide (non-executable):** Use $short-drama-write to complete EP001: a delivery worker is humiliated by a manager at an upscale restaurant, then reveals that he is a group-company director.',
                   '**English guide (non-executable):** Complete EP001: a delivery worker is humiliated by a manager at an upscale restaurant, then reveals that he is a group-company director.'),
                  ('**English guide (non-executable):** Use $short-drama-assets to extract EP001\'s characters, looks, locations, props, and episode state.',
                   '**English guide (non-executable):** Extract EP001\'s characters, looks, locations, props, and episode state.'),
                  ('**English guide (non-executable):** Use $short-drama-image-prompts to write copy-ready image prompts for EP001\'s characters, locations, and key props.',
                   '**English guide (non-executable):** Write copy-ready image prompts for EP001\'s characters, locations, and key props.'),
                  ('**English guide (non-executable):** Use $short-drama-storyboard to complete EP001\'s production storyboard and frozen keyframe for every shot.',
                   '**English guide (non-executable):** Complete EP001\'s production storyboard and frozen keyframe for every shot.'),
                  ('**English guide (non-executable):** Use $short-drama-video-prompts to turn each EP001 storyboard shot into a copy-ready video prompt.',
                   '**English guide (non-executable):** Turn each EP001 storyboard shot into a copy-ready video prompt.'),
                  ('**English guide (non-executable):** Use $short-drama-produce to preview this batch of EP001 image and video jobs; wait for my confirmation before executing them.',
                   '**English guide (non-executable):** Preview this batch of EP001 image and video jobs; wait for my confirmation before executing them.'),
              ],
              Path('drama/Chinese-to-English/SKILL - Short Drama Storyboard.md'): [
                  ('**English guide (non-executable):** Use $short-drama-storyboard to complete EP001\'s production storyboard and frozen keyframe for every shot.',
                   '**English guide (non-executable):** Complete EP001\'s production storyboard and frozen keyframe for every shot.'),
              ],
              Path('drama/Chinese-to-English/SKILL - Short Drama Write.md'): [
                  ('**English guide (non-executable):** Replace `{技能目录}` with the skill directory. The screenplay is `剧集/EP001/剧本.md`. Paste the complete temporary path printed by the first command into `--output` and `--index`; replace “episode character one/two” with the actual speaker names.',
                   '**English guide (non-executable):** Replace `{技能目录}` with the skill directory. The screenplay is `剧集/EP001/剧本.md`. Paste the complete temporary path printed by the first command into the output-path and index-path arguments; replace “episode character one/two” with the actual speaker names.'),
              ],
              Path('drama/Chinese-to-English/README - DRAMA SKILLS'): [
                  ('**Chinese** | [English](README%20-%20Drama%20Skills%20-%20English.md)',
                   '**Chinese** | [English](README_EN.md)'),
                  ('> **English companion:** The exact Chinese prompts below are retained for source fidelity. Their line-by-line English equivalents appear in the [English Quick Start](README%20-%20Drama%20Skills%20-%20English.md#quick-start).\n\n',
                   ''),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              changed = False
              for old, new in pairs:
                  count = text.count(old)
                  if count == 1:
                      text = text.replace(old, new, 1)
                      changed = True
                  elif count == 0 and new in text:
                      continue
                  else:
                      raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:80]}')
              if changed:
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified drama content repairs
        run: |
          paths=(
            "drama/Chinese-to-English/Docs - comic-drama-workflow.md"
            "drama/Chinese-to-English/README - DRAMA SKILLS"
            "drama/Chinese-to-English/SKILL - Short Drama Storyboard.md"
            "drama/Chinese-to-English/SKILL - Short Drama Write.md"
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Verified drama repairs are already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "Repair drama translation invariant mutations (#4)"
            git push
          fi
      - name: Audit all translation pairs
        run: python -m tools.translation.audit_invariants --output issue-4-audit.json
      - name: Print audit summary and diagnostics
        if: always()
        run: |
          if [ -f issue-4-audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          print(json.dumps(report['summary'], ensure_ascii=False, indent=2))
          print('\nFAILING FILE DIAGNOSTICS')
          for finding in report.get('findings', []):
              if not finding.get('errors'):
                  continue
              print(f"\n### {finding['destination']}")
              print('errors:', json.dumps(finding['errors'], ensure_ascii=False))
              relevant = {
                  key: value
                  for key, value in finding.get('details', {}).items()
                  if key not in {'inline_code_formatting', 'protected_token_formatting'}
              }
              print(json.dumps(relevant, ensure_ascii=False, indent=2))
          PY
          fi
      - name: Enforce population gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          failures = report['summary']['validator_failing']
          if failures:
              raise SystemExit(f'{failures} translation pair(s) still fail the approved validator')
          PY
