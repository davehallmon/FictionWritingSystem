name: Issue 4 population audit

on:
  push:
    branches:
      - audit/issue-4-markdown-invariants
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow URL punctuation repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/translation/validate_translation.py')
          text = path.read_text(encoding='utf-8')
          replacement = '''TRAILING_URL_PUNCTUATION = ".,;:!?\\\"'。，、；：！？"'''
          updated, count = re.subn(
              r'^TRAILING_URL_PUNCTUATION = .*$',
              replacement,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f'Expected one URL punctuation constant; found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Run translation regression tests
        run: python -m unittest discover -s tools/translation/tests -v
      - name: Commit tested validator repair
        run: |
          if git diff --quiet -- tools/translation/validate_translation.py; then
            echo "Validator already contains the tested URL punctuation repair."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/translation/validate_translation.py
            git commit -m "Normalize CJK URL punctuation in validator (#4)"
            git push
          fi
      - name: Audit all translation pairs
        run: python -m tools.translation.audit_invariants --output issue-4-audit.json
      - name: Print audit summary
        if: always()
        run: |
          if [ -f issue-4-audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          print(json.dumps(report['summary'], ensure_ascii=False, indent=2))
          for label, paths in report.get('files_by_error', {}).items():
              print(f'\n{label}: {len(paths)}')
              for path in paths:
                  print(f'- {path}')
          PY
          fi
      - name: Enforce population gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('issue-4-audit.json').read_text(encoding='utf-8'))
          failures = report['summary']['validator_failing']
          if failures:
              raise SystemExit(f'{failures} translation pair(s) still fail the approved validator')
          PY
