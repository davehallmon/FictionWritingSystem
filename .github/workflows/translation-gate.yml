name: Translation Gate

on:
  pull_request:
    branches:
      - main
      - translation/chinese-to-english
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches:
      - main
      - translation/chinese-to-english

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: translation-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translation-acceptance:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run translation regression tests
        run: python -m unittest discover -s tools/translation/tests -v

      - name: Validate all 162 translations and residual ledger
        run: python tools/translation/check_translation_gate.py --report translation-gate-report.json

      - name: Verify manifest is reproducible and current
        shell: bash
        run: |
          cp translation-manifest.json "$RUNNER_TEMP/translation-manifest.before.json"
          python tools/translation/build_manifest.py
          diff -u "$RUNNER_TEMP/translation-manifest.before.json" translation-manifest.json

      - name: Publish concise acceptance summary
        if: always()
        shell: bash
        run: |
          if [ -f translation-gate-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("translation-gate-report.json").read_text(encoding="utf-8"))
          validator = report.get("validator", {})
          residual = report.get("residual_review", {})
          print("## Translation acceptance")
          print()
          print(f"- Result: **{'PASS' if report.get('accepted') else 'FAIL'}**")
          print(f"- Structural validator: **{validator.get('pass', 0)}/{report.get('targets_expected', 162)} pass**")
          print(f"- Validator failures: **{validator.get('fail', 0)}**")
          print(f"- Residual review accepted: **{residual.get('accepted', False)}**")
          print(f"- Unexplained/deprecated/missing findings: **{len(report.get('failures', []))}**")
          print(f"- Residual-ledger drift: **{report.get('ledger_new_or_changed', 0) + report.get('ledger_stale_or_removed', 0)}**")
          if report.get("failures"):
              print("\n### First failures")
              for failure in report["failures"][:15]:
                  location = failure.get("path", "<unknown>")
                  if failure.get("line"):
                      location += f":{failure['line']}"
                  errors = "; ".join(failure.get("errors", [])[:3])
                  print(f"- `{location}` — {errors}")
          PY
          else
            echo "## Translation acceptance" >> "$GITHUB_STEP_SUMMARY"
            echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload translation-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-gate-report
          path: translation-gate-report.json
          if-no-files-found: warn
          retention-days: 30

  release-review-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce issue traceability and release review
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Pull request payload is required for governance checks.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const relevant = files.some(({filename}) =>
              filename.startsWith('drama/') ||
              filename.startsWith('oh-story/') ||
              filename.startsWith('tools/translation/') ||
              filename === 'translation-manifest.json' ||
              filename === 'translation-glossary.json' ||
              filename === 'translation-residual-exceptions.json' ||
              filename === 'translation-residual-review.md' ||
              filename === 'TRANSLATION_WORKFLOW.md' ||
              filename === 'TRANSLATION_GOVERNANCE.md' ||
              filename === '.github/workflows/translation-gate.yml'
            );

            if (!relevant) {
              core.notice('PR does not touch the translation acceptance surface; governance gate passes.');
              return;
            }

            const body = pr.body || '';
            const issueRef = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)?\s*#\d+|github\.com\/[^/]+\/[^/]+\/issues\/\d+/i;
            if (!issueRef.test(body)) {
              core.setFailed('Translation-related PRs must link at least one GitHub audit issue in the PR body.');
              return;
            }

            if (pr.base.ref !== 'main') {
              core.notice(`Traceability satisfied for remediation PR #${pr.number}; independent approval is enforced on the final PR to main.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const latest = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login || login === pr.user.login) continue;
              if (!['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) continue;
              latest.set(login, review.state);
            }
            const approvals = [...latest.entries()].filter(([, state]) => state === 'APPROVED');
            if (approvals.length < 1) {
              core.setFailed('Final translation remediation PRs to main require at least one independent GitHub APPROVED review.');
              return;
            }
            core.notice(`Independent approval satisfied by: ${approvals.map(([login]) => login).join(', ')}`);
