name: Issue 6 Manifest Audit

on:
  push:
    branches:
      - translation/issue-6-manifest

permissions:
  contents: write

jobs:
  manifest-audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/issue-6-manifest
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run all translation tests
        run: python -m unittest discover -s tools/translation/tests -v

      - name: Establish canonical v2 baseline
        run: python tools/translation/build_manifest.py --no-previous-manifest

      - name: Prove deterministic regeneration before commit
        run: |
          cp translation-manifest.json /tmp/translation-manifest.baseline.json
          python tools/translation/build_manifest.py
          diff -u /tmp/translation-manifest.baseline.json translation-manifest.json

      - name: Commit canonical manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate canonical manifest schema v2 [skip ci]"
          fi

      - name: Prove regeneration is stable after manifest commit
        run: |
          python tools/translation/build_manifest.py
          git diff --exit-code -- translation-manifest.json

      - name: Push canonical manifest
        run: git push origin HEAD:translation/issue-6-manifest
